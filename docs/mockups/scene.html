<!doctype html>
<!--
  The fake app the README mockups are drawn on. render.py screenshots it and
  feeds it to the real overlay (app/ui/overlay.html) as the frozen screen.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --add: #34c759; --remove: #ff3b30; --change: #0a84ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: #0b0c10; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; color: #e6e8ee; }
  #stage { position: relative; width: 1200px; height: 720px; overflow: hidden; }

  /* ---------------- fake web app */
  .browser { position: absolute; inset: 80px 24px 24px; border-radius: 12px; overflow: hidden; background: #15171c; border: 1px solid #262a33; box-shadow: 0 16px 50px rgba(0, 0, 0, .55); }
  .chrome { height: 42px; background: #1b1e24; border-bottom: 1px solid #262a33; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .chrome i { width: 11px; height: 11px; border-radius: 50%; background: #3a3f4a; }
  .url { margin-left: 18px; flex: 0 0 420px; height: 26px; border-radius: 7px; background: #121419; border: 1px solid #2a2e37; font-size: 12px; color: #8b93a3; display: flex; align-items: center; padding: 0 10px; }
  .app { display: flex; height: calc(100% - 42px); }
  nav { width: 200px; background: #121419; border-right: 1px solid #22262e; padding: 22px 14px; }
  nav .logo { font-weight: 700; font-size: 16px; margin: 0 8px 22px; }
  nav a { display: block; padding: 8px 10px; border-radius: 7px; color: #a3abba; margin-bottom: 2px; }
  nav a.on { background: #1f2a44; color: #8fb0ff; font-weight: 600; }
  main { flex: 1; padding: 30px 40px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: #8b93a3; margin-bottom: 26px; }
  .card { background: #181b21; border: 1px solid #262a33; border-radius: 10px; padding: 20px 22px; margin-bottom: 18px; }
  .profile { display: flex; align-items: center; gap: 18px; }
  .avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #8aa6ff, #c79bff); }
  .field { display: grid; grid-template-columns: 140px 1fr; align-items: center; gap: 10px 16px; }
  .input { height: 34px; border: 1px solid #2b303a; background: #121419; border-radius: 7px; padding: 0 10px; display: flex; align-items: center; color: #d5d9e2; }
  .btn { display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 7px; border: 1px solid #2f3440; background: #1f232b; font-weight: 600; color: #d5d9e2; }
  .btn.primary { background: #3f6df0; border-color: #3f6df0; color: #fff; }
  .actions { display: flex; gap: 10px; margin-top: 4px; }

</style>
</head>
<body>
<div id="stage">
  <div class="browser">
    <div class="chrome"><i></i><i></i><i></i><div class="url">localhost:3000/settings/profile</div></div>
    <div class="app">
      <nav>
        <div class="logo">Taskly</div>
        <a>Dashboard</a><a>Projects</a><a>Team</a><a class="on">Settings</a><a>Billing</a>
      </nav>
      <main>
        <h1>Profile</h1>
        <div class="sub">Manage how others see you on Taskly.</div>
        <div class="card profile">
          <div class="avatar"></div>
          <div><b>Alex Morgan</b><div class="sub" style="margin:0">alex@example.com</div></div>
          <div style="flex:1"></div>
          <span class="btn">Change photo</span>
        </div>
        <div class="card field">
          <span>Display name</span><div class="input">Alex Morgan</div>
          <span>Job title</span><div class="input">Product designer</div>
          <span>Time zone</span><div class="input">Europe/Berlin (UTC+1)</div>
        </div>
        <div class="actions">
          <span class="btn">Cancel</span>
          <span class="btn">Export legacy CSV</span>
        </div>
      </main>
    </div>
  </div>

</div>
</body>
</html>
