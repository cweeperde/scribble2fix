name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press F6
        2. ...
  - type: input
    id: version
    attributes:
      label: Scribble2Fix version
      description: Tray icon → Settings → About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version / distribution
      placeholder: "Windows 11 24H2, macOS 15.2, Ubuntu 24.04, ..."
  - type: dropdown
    id: tool
    attributes:
      label: AI tool involved (if any)
      options:
        - None / clipboard only
        - Claude Code
        - Claude Desktop
        - Codex
        - Other
