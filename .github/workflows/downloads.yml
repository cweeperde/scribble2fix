name: Download count

# GitHub's download count includes every file of a release, also the
# latest.json each installed app fetches when it checks for updates. This
# counts only the installers (not latest.json, the macOS update archive or
# signatures) and writes the result as a shields.io endpoint badge to the
# `badges` branch, which the README shows.
on:
  schedule:
    - cron: '17 */6 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - name: Count installer downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          total=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[].assets[] | select(.name | test("[.](exe|msi|dmg|AppImage|deb|rpm)$")) | .download_count' \
            | awk '{ s += $1 } END { print s + 0 }')
          echo "Installer downloads: $total"
          mkdir out
          printf '{"schemaVersion":1,"label":"downloads","message":"%s","color":"34c759"}\n' "$total" > out/downloads.json

      - name: Publish to the badges branch
        working-directory: out
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git commit -qm "Download count"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
