<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scribble2Fix</title>
<style>
  :root {
    --add: #34c759;
    --remove: #ff3b30;
    --change: #0a84ff;
    --bar: rgba(28, 28, 32, 0.84);
    --line: rgba(255, 255, 255, 0.10);
    --text: rgba(255, 255, 255, 0.86);
    --spring: cubic-bezier(0.2, 1.25, 0.35, 1);
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000;
    user-select: none; -webkit-user-select: none;
    font: 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  #live { cursor: crosshair; touch-action: none; }

  /* ---------------- frozen-screen frame + intro */
  #frame {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; padding: 3px; opacity: 0.6;
    background: linear-gradient(120deg, var(--add), var(--change), var(--remove), var(--add)) 0 0 / 300% 300%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
  }
  /* Soft glow along the edges, only during the intro. */
  #glow {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0;
    box-shadow: inset 0 0 90px 10px rgba(10, 132, 255, 0.22);
  }
  /* One soft band of light sweeping across the frozen screen. */
  #shine {
    position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.07) 50%, transparent 65%) no-repeat;
    background-size: 250% 100%;
  }
  body.intro #frame { animation: frame-in 0.6s var(--ease), drift 1.6s var(--ease); }
  body.intro #glow { animation: glow 1.1s var(--ease); }
  body.intro #shine { animation: shine 1.1s cubic-bezier(0.4, 0, 0.2, 1) 0.05s; }
  body.intro #toolbar { animation: glide-in 0.55s var(--ease) 0.08s backwards; }
  body.intro #hint { animation: hint-in 0.5s var(--ease) 0.25s backwards; }
  body.outro #toolbar, body.outro #hint, body.outro #frame { transition: opacity 0.14s, transform 0.14s; opacity: 0; transform: translateY(-6px); }
  @keyframes drift { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @keyframes frame-in { from { opacity: 0; } to { opacity: 0.6; } }
  @keyframes glow { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes shine { from { opacity: 1; background-position: 120% 0; } to { opacity: 1; background-position: -20% 0; } }
  @keyframes glide-in { from { opacity: 0; transform: translateY(-16px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes hint-in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  #shot { position: fixed; z-index: 3; pointer-events: none; border-radius: 10px; background: #fff; opacity: 0; }
  #shot.go { animation: shot 0.16s var(--ease); }
  @keyframes shot { from { opacity: 0.18; } to { opacity: 0; } }

  /* ---------------- toolbar */
  #toolbar-pos { position: fixed; z-index: 2; top: 20px; left: 50%; transform: translateX(-50%); }
  #toolbar {
    display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 16px; color: var(--text);
    background: var(--bar); border: 1px solid var(--line);
    backdrop-filter: blur(24px) saturate(1.6);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  #grip {
    width: 12px; height: 30px; margin: 0 2px; cursor: grab; border-radius: 6px;
    background-image: radial-gradient(rgba(255, 255, 255, 0.4) 1.1px, transparent 1.6px);
    background-size: 6px 6px; background-position: center; transition: background-color 0.15s;
  }
  #grip:hover { background-color: rgba(255, 255, 255, 0.06); }
  #grip:active { cursor: grabbing; }
  button {
    all: unset; box-sizing: border-box; height: 34px; min-width: 34px; padding: 0 10px;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; position: relative;
    border-radius: 10px; cursor: pointer; color: var(--text); white-space: nowrap;
    transition: background-color 0.15s, color 0.15s, transform 0.12s var(--ease), opacity 0.15s;
  }
  button:hover { background: rgba(255, 255, 255, 0.09); color: #fff; }
  button:active { transform: scale(0.92); }
  button.on { background: rgba(255, 255, 255, 0.16); color: #fff; }
  button:disabled { opacity: 0.28; pointer-events: none; }
  button[data-key]::after {
    content: attr(data-key); position: absolute; right: 3px; bottom: 2px;
    font-size: 8.5px; font-weight: 600; line-height: 1; color: rgba(255, 255, 255, 0.35);
    transition: color 0.15s;
  }
  button[data-mode] { padding-right: 14px; }
  button:hover[data-key]::after, button.on[data-key]::after { color: rgba(255, 255, 255, 0.7); }
  button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .dot {
    width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
    transition: transform 0.25s var(--spring), box-shadow 0.2s;
  }
  button.on .dot { transform: scale(1.2); box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.55); }
  .sep { width: 1px; height: 20px; margin: 0 4px; background: var(--line); flex: none; }
  #ok { background: var(--change); color: #fff; padding: 0 13px; font-weight: 600; box-shadow: 0 2px 10px rgba(10, 132, 255, 0.35); }
  #ok:hover { filter: brightness(1.12); }

  /* Extra tools (text, number, eraser, size): folded away by default. */
  #extras {
    display: flex; align-items: center; gap: 2px; overflow: hidden;
    max-width: 0; opacity: 0; margin-left: -2px;
    transition: max-width 0.32s var(--ease), opacity 0.2s, margin 0.32s var(--ease);
  }
  #toolbar.open #extras { max-width: 200px; opacity: 1; margin-left: 0; }
  #more svg { transition: transform 0.3s var(--spring); }
  #toolbar.open #more svg { transform: rotate(180deg); }
  #toolbar.simple #more, #toolbar.simple #extras { display: none; }
  #size { width: 40px; }
  #size-dot { border-radius: 50%; box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25); transition: width 0.2s var(--spring), height 0.2s var(--spring), background-color 0.2s; }

  #hint {
    position: fixed; z-index: 1; top: 80px; left: 50%; translate: -50% 0;
    max-width: calc(100vw - 48px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding: 10px 16px; border-radius: 999px; color: #fff; pointer-events: none;
    background: var(--bar); border: 1px solid var(--line); backdrop-filter: blur(20px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); transition: opacity 0.3s, transform 0.3s var(--ease);
  }
  #hint kbd {
    font: inherit; padding: 2px 6px; margin: 0 2px; border-radius: 5px;
    background: rgba(255, 255, 255, 0.14);
  }
  #hint.hidden { opacity: 0; transform: translateY(-6px); }

  /* ---------------- text label editor (same look as the drawn label) */
  #text-box {
    position: fixed; z-index: 3; display: flex; align-items: center; box-sizing: border-box;
    border-radius: 999px; background: #18181c; border-style: solid;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); animation: pop 0.22s var(--spring);
  }
  #text-box i { flex: none; border-radius: 50%; }
  #text-box input {
    all: unset; flex: 1; min-width: 0; color: #fff; caret-color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 600;
  }
  #text-box input::placeholder { color: rgba(255, 255, 255, 0.45); }
  @keyframes pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="fg"></canvas>
<canvas id="live"></canvas>
<div id="glow"></div>
<div id="shine"></div>
<div id="frame"></div>
<div id="shot"></div>

<div id="hint">Draw on the screen · <kbd>Enter</kbd> copy · <kbd>Esc</kbd> cancel</div>

<div id="toolbar-pos">
<div id="toolbar">
  <div id="grip" title="Drag to move"></div>
  <button data-mode="add" data-key="1" title="Add something new (1)"><span class="dot" style="background:var(--add)"></span>Add</button>
  <button data-mode="remove" data-key="2" title="Remove this (2)"><span class="dot" style="background:var(--remove)"></span>Remove</button>
  <button data-mode="change" data-key="3" title="Change or move this (3)"><span class="dot" style="background:var(--change)"></span>Change</button>
  <div class="sep"></div>
  <button data-tool="pen" data-key="P" title="Freehand (P)"><svg viewBox="0 0 24 24"><path d="M4 17c3-6 5-9 7-9s0 8 3 8 3-5 6-7"/></svg></button>
  <button data-tool="box" data-key="B" title="Box (B)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2.5"/></svg></button>
  <button data-tool="arrow" data-key="A" title="Arrow (A)"><svg viewBox="0 0 24 24"><path d="M5 19 14 10"/><path d="M19 5 10.5 7.5 16.5 13.5Z" fill="currentColor"/></svg></button>
  <div id="extras">
    <button data-tool="text" data-key="T" title="Text label (T)"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13"/></svg></button>
    <button data-tool="marker" data-key="N" title="Numbered marker (N)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M10.5 9.5 12.5 8v8"/></svg></button>
    <button data-tool="eraser" data-key="E" title="Delete a mark (E, or right-click any mark)"><svg viewBox="0 0 24 24"><path d="m14 5 5 5-8.5 8.5H6L3.5 16 14 5Z"/><path d="M9 10l5 5M11 18.5h9"/></svg></button>
    <button id="size" data-key="+/-" title="Stroke size (+ / −, or Ctrl + scroll)"><span id="size-dot"></span></button>
  </div>
  <button id="more" title="More tools: text, numbers, eraser, size"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
  <div class="sep"></div>
  <button id="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button id="redo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
  <div class="sep"></div>
  <button id="cancel" title="Cancel (Esc)"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <button id="ok" title="Copy to clipboard (Enter)"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7"/></svg>Copy</button>
</div>
</div>

<script src="guard.js"></script>
<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;

const COLORS = { add: '#34c759', remove: '#ff3b30', change: '#0a84ff' };
const MEANING = { add: 'add', remove: 'remove', change: 'change / move' };
const LEGEND = [['add', 'add'], ['remove', 'remove'], ['change', 'change / move']];
const SIZES = [3, 5, 8, 12, 18];   // stroke widths in CSS px, picked with + / - or Ctrl + scroll
const DEFAULT_SIZE = 1;
const MAX_EDGE = 1800;       // long edge of the exported image, px
const LEGEND_HEIGHT = 30;    // legend strip below the exported image, px
const FONT = 'system-ui, -apple-system, "Segoe UI", sans-serif';
const LABEL_BG = '#18181c';

const $ = (id) => document.getElementById(id);
const bg = $('bg'), fg = $('fg'), live = $('live');
const fgCtx = fg.getContext('2d'), liveCtx = live.getContext('2d');
const toolbar = $('toolbar'), toolbarPos = $('toolbar-pos'), hint = $('hint');

let W = 0, H = 0;            // frozen screen size in physical px (canvas px)
let mode = 'add', tool = 'pen', size = DEFAULT_SIZE;
// Marks: { kind: 'pen'|'box'|'arrow'|'text'|'marker', mode, w, pts, text?, n? }.
// Undo/redo keep whole snapshots, so deleting a single mark is undoable too.
let marks = [], undoStack = [], redoStack = [], current = null, busy = false;
let textInput = null;        // the open text-label editor, if any
let simple = false;          // Settings → "Simple toolbar": only colors, freehand, box, arrow

// Whether the extra tools are unfolded; remembered between captures.
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
setExtrasOpen(store.get('extras') === 'open');

// Canvas pixels per CSS pixel (= devicePixelRatio, but robust to rounding).
const ratio = () => (W && innerWidth ? W / innerWidth : devicePixelRatio);

// ------------------------------------------------------------ capture lifecycle

listen('capture', async ({ payload }) => {
  reset(payload.request);
  simple = payload.simple;
  toolbar.classList.toggle('simple', simple);
  if (simple) size = DEFAULT_SIZE;
  W = payload.width; H = payload.height;
  for (const c of [bg, fg, live]) { c.width = W; c.height = H; }
  const buf = await invoke('frozen_pixels');
  bg.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(buf), W, H), 0, 0);
  placeToolbar();
  updateButtons();
  playIntro(); // starts just before the window appears, so the first frame is already animated
  await invoke('show_overlay');
});

// Restarts the CSS intro animations (frame fade, glow, shine, toolbar glide-in).
function playIntro() {
  document.body.classList.remove('intro', 'outro');
  void document.body.offsetWidth;
  document.body.classList.add('intro');
}

// `request`: what an AI tool asked the user to mark, if any.
function reset(request) {
  closeTextInput(false);
  marks = []; undoStack = []; redoStack = []; current = null; busy = false;
  tool = 'pen';
  fgCtx.clearRect(0, 0, fg.width, fg.height);
  liveCtx.clearRect(0, 0, live.width, live.height);
  hint.textContent = '';
  if (request) hint.append(request + ' · ', kbd('Enter'), ' send · ', kbd('Esc'), ' cancel');
  else hint.append('Draw on the screen · ', kbd('Enter'), ' copy · ', kbd('Esc'), ' cancel');
  hint.classList.remove('hidden');
  updateButtons();
}

function kbd(text) { const k = document.createElement('kbd'); k.textContent = text; return k; }

// Top center, a little away from the edge. It can be dragged from there.
function placeToolbar() {
  Object.assign(toolbarPos.style, { left: '50%', top: '20px', transform: 'translateX(-50%)' });
}

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function cancel() {
  if (busy) return;
  busy = true;
  document.body.classList.add('outro');
  await sleep(110);
  await invoke('cancel_capture');
  reset();
}

// ------------------------------------------------------------ editing

function commit(next) {
  undoStack.push(marks);
  marks = next;
  redoStack = [];
  redraw();
}

function undo() {
  if (!undoStack.length) return;
  redoStack.push(marks);
  marks = undoStack.pop();
  redraw();
}

function redo() {
  if (!redoStack.length) return;
  undoStack.push(marks);
  marks = redoStack.pop();
  redraw();
}

function toCanvas(e) {
  const k = ratio();
  return [e.clientX * k, e.clientY * k];
}

const newMark = (kind, pts) => ({ kind, mode, w: SIZES[size] * ratio(), pts });

live.addEventListener('pointerdown', (e) => {
  if (busy) return;
  const p = toCanvas(e);
  if (e.button === 2) { if (!simple) eraseAt(p); return; }
  if (e.button !== 0) return;
  if (textInput) { closeTextInput(true); return; }
  hint.classList.add('hidden');
  if (tool === 'eraser') { eraseAt(p); return; }
  if (tool === 'marker') {
    const n = Math.max(0, ...marks.filter((m) => m.kind === 'marker').map((m) => m.n)) + 1;
    commit([...marks, { ...newMark('marker', [p]), n }]);
    return;
  }
  if (tool === 'text') {
    e.preventDefault(); // otherwise the click moves focus away from the new field
    openTextInput(e.clientX, e.clientY, p);
    return;
  }
  live.setPointerCapture(e.pointerId);
  current = newMark(tool, [p]);
  if (tool === 'arrow') current.path = [p];
  renderLive();
});

live.addEventListener('pointermove', (e) => {
  if (!current) return;
  if (current.kind === 'pen') {
    const events = e.getCoalescedEvents?.() ?? [];
    for (const ev of events.length ? events : [e]) current.pts.push(toCanvas(ev));
  } else {
    current.pts[1] = toCanvas(e);
    if (current.kind === 'arrow') {
      current.path.push(current.pts[1]);
      current.c = arrowCurve(current);
    }
  }
  renderLive();
});

live.addEventListener('pointerup', finishStroke);
live.addEventListener('pointercancel', finishStroke);

function finishStroke() {
  if (!current) return;
  const s = current;
  current = null;
  liveCtx.clearRect(0, 0, W, H);
  // Ignore accidental clicks with the box/arrow tools.
  if (s.kind !== 'pen' && (!s.pts[1] || Math.hypot(s.pts[1][0] - s.pts[0][0], s.pts[1][1] - s.pts[0][1]) < 6 * ratio())) return;
  delete s.path;
  commit([...marks, s]);
}

// Deletes the topmost mark under the point.
function eraseAt(p) {
  for (let i = marks.length - 1; i >= 0; i--) {
    if (hits(marks[i], p)) { commit(marks.filter((_, j) => j !== i)); return; }
  }
}

// ------------------------------------------------------------ text labels

// Font size (canvas px) and pill layout of a text label; shared by the editor
// and the drawn label so both look the same.
function labelLayout(w) {
  const fs = Math.max(15 * ratio(), 10 * ratio() + w * 1.2);
  return { fs, h: fs * 1.9, pad: fs * 0.7, dot: fs * 0.42, gap: fs * 0.45, border: Math.max(2, fs * 0.12) };
}

function openTextInput(clientX, clientY, p) {
  const k = ratio();
  const mark = { ...newMark('text', [p]), text: '' };
  const L = labelLayout(mark.w);
  const box = document.createElement('div');
  box.id = 'text-box';
  const dot = document.createElement('i');
  const input = document.createElement('input');
  input.spellcheck = false;
  input.placeholder = 'Type a note, Enter';
  box.append(dot, input);
  Object.assign(box.style, {
    left: clientX + 'px', top: clientY - L.h / k / 2 + 'px', height: L.h / k + 'px',
    padding: `0 ${L.pad / k}px`, gap: L.gap / k + 'px',
    borderWidth: L.border / k + 'px', borderColor: COLORS[mode],
  });
  Object.assign(dot.style, { width: L.dot / k + 'px', height: L.dot / k + 'px', background: COLORS[mode] });
  input.style.fontSize = L.fs / k + 'px';
  // Size the field to its text exactly (ch units cut off wide letters).
  const fit = () => {
    liveCtx.font = `600 ${L.fs}px ${FONT}`;
    input.style.width = Math.ceil(liveCtx.measureText(input.value || input.placeholder).width / k) + 2 + 'px';
  };
  input.addEventListener('input', fit);
  input.addEventListener('keydown', (e) => {
    e.stopPropagation(); // keep 1/2/3, P, Enter, Esc... for the label
    if (e.key === 'Enter') closeTextInput(true);
    else if (e.key === 'Escape') closeTextInput(false);
  });
  fit();
  textInput = { box, input, mark };
  document.body.append(box);
  input.focus();
  setTimeout(() => input.focus(), 0);
}

function closeTextInput(keep) {
  if (!textInput) return;
  const { box, input, mark } = textInput;
  textInput = null;
  const text = input.value.trim();
  box.remove();
  if (keep && text) commit([...marks, { ...mark, text }]);
}

// ------------------------------------------------------------ geometry

const markerRadius = (s) => 7 * ratio() + s.w * 1.2;

// Pill rectangle of a text label: [x, y, width, height], anchored left-center at its point.
function textRect(s) {
  const L = labelLayout(s.w);
  liveCtx.font = `600 ${L.fs}px ${FONT}`;
  const w = L.pad * 2 + L.dot + L.gap + liveCtx.measureText(s.text).width;
  return [s.pts[0][0], s.pts[0][1] - L.h / 2, w, L.h];
}

// [x0, y0, x1, y1] including halos and arrowheads.
function bounds(s) {
  if (s.kind === 'text') { const [x, y, w, h] = textRect(s); return [x - 4, y - 4, x + w + 4, y + h + 4]; }
  if (s.kind === 'marker') { const r = markerRadius(s) + 4; const [x, y] = s.pts[0]; return [x - r, y - r, x + r, y + r]; }
  const m = s.kind === 'arrow' ? s.w * 4 : s.w * 2;
  const pts = s.c ? [...s.pts, s.c] : s.pts; // a curve stays inside its control triangle
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  return [Math.min(...xs) - m, Math.min(...ys) - m, Math.max(...xs) + m, Math.max(...ys) + m];
}

function segDist(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], len2 = dx * dx + dy * dy;
  const t = len2 ? clamp(((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len2, 0, 1) : 0;
  return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
}

function hits(s, p) {
  const tol = s.w + 6 * ratio();
  if (s.kind === 'text') { const [x, y, w, h] = textRect(s); return p[0] >= x && p[0] <= x + w && p[1] >= y && p[1] <= y + h; }
  if (s.kind === 'marker') return Math.hypot(p[0] - s.pts[0][0], p[1] - s.pts[0][1]) <= markerRadius(s) + 4;
  if (s.kind === 'box') {
    const [a, b] = s.pts;
    const c = [[a[0], a[1]], [b[0], a[1]], [b[0], b[1]], [a[0], b[1]]];
    return c.some((q, i) => segDist(p, q, c[(i + 1) % 4]) <= tol);
  }
  if (s.kind === 'arrow') return arrowPoints(s).some((q, i, a) => i > 0 && segDist(p, a[i - 1], q) <= tol);
  if (s.pts.length === 1) return Math.hypot(p[0] - s.pts[0][0], p[1] - s.pts[0][1]) <= tol;
  return s.pts.some((q, i) => i > 0 && segDist(p, s.pts[i - 1], q) <= tol);
}

// ------------------------------------------------------------ drawing

function renderLive() {
  liveCtx.clearRect(0, 0, W, H);
  if (current && (current.kind === 'pen' || current.pts[1])) drawMark(liveCtx, current);
}

function redraw() {
  fgCtx.clearRect(0, 0, W, H);
  for (const s of marks) drawMark(fgCtx, s);
  updateButtons();
}

function tracePath(ctx, s) {
  const p = s.pts;
  ctx.beginPath();
  if (s.kind === 'pen') {
    ctx.moveTo(p[0][0], p[0][1]);
    if (p.length === 1) { ctx.lineTo(p[0][0] + 0.01, p[0][1]); return; }
    // Smooth through midpoints.
    for (let i = 1; i < p.length - 1; i++) {
      ctx.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
    }
    ctx.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
  } else if (s.kind === 'box') {
    const [a, b] = p;
    const x = Math.min(a[0], b[0]), y = Math.min(a[1], b[1]);
    const w = Math.abs(b[0] - a[0]), h = Math.abs(b[1] - a[1]);
    ctx.roundRect(x, y, w, h, Math.min(s.w * 2, w / 2, h / 2));
  } else {
    // Shaft only; it stops inside the head so its round cap doesn't poke out.
    const { a, c, base } = arrowGeometry(s);
    ctx.moveTo(a[0], a[1]);
    if (c) ctx.quadraticCurveTo(c[0], c[1], base[0], base[1]);
    else ctx.lineTo(base[0], base[1]);
  }
}

// Arrows follow the dragged path: a clearly bent drag becomes one smooth
// curve (quadratic Bezier with control point c), a roughly straight one stays straight.
function arrowCurve(s) {
  const [a, b] = s.pts, path = s.path;
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  if (!len || path.length < 3) return null;
  // Least-squares control point, parameterized by distance along the drag.
  const dist = [0];
  for (let i = 1; i < path.length; i++) dist.push(dist[i - 1] + Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]));
  const total = dist[dist.length - 1] || 1;
  let sx = 0, sy = 0, sw = 0, dev = 0;
  path.forEach((q, i) => {
    const t = dist[i] / total, u = 1 - t, w = 2 * t * u;
    sx += w * (q[0] - u * u * a[0] - t * t * b[0]);
    sy += w * (q[1] - u * u * a[1] - t * t * b[1]);
    sw += w * w;
    dev = Math.max(dev, Math.abs((q[0] - a[0]) * (b[1] - a[1]) - (q[1] - a[1]) * (b[0] - a[0])) / len);
  });
  if (!sw || dev < Math.max(10 * ratio(), len * 0.08)) return null;
  return [sx / sw, sy / sw];
}

const bezier = (a, c, b, t) => [0, 1].map((k) => (1 - t) * (1 - t) * a[k] + 2 * t * (1 - t) * c[k] + t * t * b[k]);

// Polyline along the arrow, for hit testing.
function arrowPoints(s) {
  if (!s.c) return s.pts;
  return Array.from({ length: 25 }, (_, i) => bezier(s.pts[0], s.c, s.pts[1], i / 24));
}

// Filled triangular head, sized to the stroke but never longer than half the arrow.
function arrowGeometry(s) {
  const [a, b] = s.pts, c = s.c;
  const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  const head = Math.min(s.w * 5, len / 2), half = head * 0.6;
  if (!c) {
    const ux = (b[0] - a[0]) / len, uy = (b[1] - a[1]) / len;
    const back = [b[0] - ux * head, b[1] - uy * head];
    return {
      a,
      base: [b[0] - ux * head * 0.7, b[1] - uy * head * 0.7],
      head: [b, [back[0] - uy * half, back[1] + ux * half], [back[0] + uy * half, back[1] - ux * half]],
    };
  }
  // Curved: the head points along the end of the curve; the shaft is the curve
  // cut off inside the head (de Casteljau split at t0).
  const arc = (len + Math.hypot(c[0] - a[0], c[1] - a[1]) + Math.hypot(b[0] - c[0], b[1] - c[1])) / 2;
  const tBack = clamp(1 - head / arc, 0, 1), t0 = clamp(1 - (head * 0.7) / arc, 0, 1);
  const q = bezier(a, c, b, tBack);
  const ql = Math.hypot(b[0] - q[0], b[1] - q[1]) || 1;
  const ux = (b[0] - q[0]) / ql, uy = (b[1] - q[1]) / ql;
  const back = [b[0] - ux * head, b[1] - uy * head];
  return {
    a,
    c: [a[0] + (c[0] - a[0]) * t0, a[1] + (c[1] - a[1]) * t0],
    base: bezier(a, c, b, t0),
    head: [b, [back[0] - uy * half, back[1] + ux * half], [back[0] + uy * half, back[1] - ux * half]],
  };
}

function traceArrowHead(ctx, s) {
  const [tip, l, r] = arrowGeometry(s).head;
  ctx.beginPath();
  ctx.moveTo(tip[0], tip[1]);
  ctx.lineTo(l[0], l[1]);
  ctx.lineTo(r[0], r[1]);
  ctx.closePath();
}

const HALO = 'rgba(255,255,255,0.85)';

function drawMark(ctx, s) {
  const color = COLORS[s.mode];
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  if (s.kind === 'text') {
    // Dark pill with a colored border and dot: readable on any background.
    const L = labelLayout(s.w);
    const [x, y, w, h] = textRect(s);
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, h / 2);
    ctx.fillStyle = LABEL_BG;
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = L.border;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + L.pad + L.dot / 2, y + h / 2, L.dot / 2, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = `600 ${L.fs}px ${FONT}`;
    ctx.textBaseline = 'middle';
    ctx.fillText(s.text, x + L.pad + L.dot + L.gap, y + h / 2 + L.fs * 0.04);
    return;
  }
  if (s.kind === 'marker') {
    const r = markerRadius(s);
    const [cx, cy] = s.pts[0];
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = HALO;
    ctx.lineWidth = 2 * ratio();
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `700 ${r * 1.15}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(s.n), cx, cy + r * 0.06);
    ctx.textAlign = 'start';
    return;
  }
  if (s.kind === 'arrow') {
    // Halo under shaft and head first, then the colored arrow on top.
    tracePath(ctx, s);
    ctx.strokeStyle = HALO;
    ctx.lineWidth = s.w * 1.8;
    ctx.stroke();
    traceArrowHead(ctx, s);
    ctx.lineWidth = s.w * 0.8;
    ctx.stroke();
    tracePath(ctx, s);
    ctx.strokeStyle = color;
    ctx.lineWidth = s.w * 1.2;
    ctx.stroke();
    traceArrowHead(ctx, s);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.lineWidth = s.w * 0.4;
    ctx.stroke();
    return;
  }
  tracePath(ctx, s);
  // Light halo keeps marks visible on any background.
  ctx.strokeStyle = HALO;
  ctx.lineWidth = s.w * 1.8;
  ctx.stroke();
  ctx.strokeStyle = color;
  ctx.lineWidth = s.w;
  ctx.stroke();
}

// ------------------------------------------------------------ export

async function confirm() {
  if (busy) return;
  closeTextInput(true);
  if (!marks.length) {
    hint.textContent = 'Draw something first, or press Esc to cancel';
    hint.classList.remove('hidden');
    return;
  }
  busy = true;
  const k = ratio();

  // Bounding box of all marks.
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const s of marks) {
    const [a, b, c, d] = bounds(s);
    x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d);
  }
  // Padding for context, plus a minimum size so tiny marks still show surroundings.
  const pad = clamp(0.3 * Math.max(x1 - x0, y1 - y0), 120 * k, 400 * k);
  x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
  [x0, x1] = grow(x0, x1, 560 * k, W);
  [y0, y1] = grow(y0, y1, 360 * k, H);
  const crop = { x: Math.round(x0), y: Math.round(y0), width: Math.round(x1 - x0), height: Math.round(y1 - y0) };

  // A short flash over the captured area, then hide.
  const shot = $('shot');
  Object.assign(shot.style, { left: crop.x / k + 'px', top: crop.y / k + 'px', width: crop.width / k + 'px', height: crop.height / k + 'px' });
  shot.classList.remove('go'); void shot.offsetWidth; shot.classList.add('go');
  document.body.classList.add('outro');

  const scale = Math.min(1, MAX_EDGE / Math.max(crop.width, crop.height));
  const ow = Math.round(crop.width * scale), oh = Math.round(crop.height * scale);

  const clean = document.createElement('canvas');
  clean.width = ow; clean.height = oh;
  const cctx = clean.getContext('2d');
  cctx.imageSmoothingQuality = 'high';
  cctx.drawImage(bg, crop.x, crop.y, crop.width, crop.height, 0, 0, ow, oh);

  const annotated = document.createElement('canvas');
  annotated.width = ow; annotated.height = oh + LEGEND_HEIGHT;
  const actx = annotated.getContext('2d');
  actx.imageSmoothingQuality = 'high';
  actx.drawImage(clean, 0, 0);
  actx.drawImage(fg, crop.x, crop.y, crop.width, crop.height, 0, 0, ow, oh);
  drawLegend(actx, ow, oh);

  const toImage = ([x, y]) => [Math.round((x - crop.x) * scale), Math.round((y - crop.y) * scale)];
  const described = marks.map((s) => describeMark(s, toImage));

  await sleep(140);
  // Hide first so the UI feels instant; encoding happens behind the scenes.
  await invoke('hide_overlay');
  try {
    await invoke('finish_capture', {
      annotated: annotated.toDataURL('image/png').split(',')[1],
      clean: clean.toDataURL('image/png').split(',')[1],
      crop,
      marks: described,
    });
  } finally {
    reset();
  }
}

// A mark as data for the AI, in pixels of the exported image (origin top left).
function describeMark(s, toImage) {
  const d = { kind: s.kind, meaning: MEANING[s.mode] };
  if (s.kind === 'arrow') {
    d.from = toImage(s.pts[0]); d.to = toImage(s.pts[1]);
    if (s.c) d.via = toImage(bezier(s.pts[0], s.c, s.pts[1], 0.5));
  }
  else if (s.kind === 'text') { d.at = toImage(s.pts[0]); d.text = s.text; }
  else if (s.kind === 'marker') { d.at = toImage(s.pts[0]); d.number = s.n; }
  else {
    const xs = s.pts.map((p) => p[0]), ys = s.pts.map((p) => p[1]);
    const [ax, ay] = toImage([Math.min(...xs), Math.min(...ys)]);
    const [bx, by] = toImage([Math.max(...xs), Math.max(...ys)]);
    d.box = [ax, ay, bx, by];
  }
  return d;
}

// Expand [a, b] to at least `min` long, centred, kept inside [0, limit].
function grow(a, b, min, limit) {
  const extra = Math.max(0, min - (b - a)) / 2;
  a -= extra; b += extra;
  if (a < 0) { b -= a; a = 0; }
  if (b > limit) { a -= b - limit; b = limit; }
  return [Math.max(0, a), Math.min(limit, b)];
}

function drawLegend(ctx, width, top) {
  ctx.fillStyle = '#1e1e22';
  ctx.fillRect(0, top, width, LEGEND_HEIGHT);
  ctx.font = `14px ${FONT}`;
  ctx.textBaseline = 'middle';
  const cy = top + LEGEND_HEIGHT / 2;
  let x = 12;
  for (const [key, label] of LEGEND) {
    ctx.fillStyle = COLORS[key];
    ctx.beginPath();
    ctx.arc(x + 5, cy, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.fillText(label, x + 15, cy + 1);
    x += 15 + ctx.measureText(label).width + 18;
  }
}

// ------------------------------------------------------------ controls

const EXTRA_TOOLS = ['text', 'marker', 'eraser'];

function setMode(m) { mode = m; updateButtons(); }
function setTool(t) {
  closeTextInput(true);
  tool = t;
  if (EXTRA_TOOLS.includes(t)) setExtrasOpen(true);
  updateButtons();
}
function setSize(i) { size = clamp(i, 0, SIZES.length - 1); setExtrasOpen(true); updateButtons(); }

function setExtrasOpen(open) {
  toolbar.classList.toggle('open', open);
  $('more').title = open ? 'Fewer tools' : 'More tools: text, numbers, eraser, size';
  store.set('extras', open ? 'open' : 'closed');
}

function updateButtons() {
  for (const b of toolbar.querySelectorAll('[data-mode]')) b.classList.toggle('on', b.dataset.mode === mode);
  for (const b of toolbar.querySelectorAll('[data-tool]')) b.classList.toggle('on', b.dataset.tool === tool);
  // Folded away but active: highlight the fold button instead.
  $('more').classList.toggle('on', EXTRA_TOOLS.includes(tool) && !toolbar.classList.contains('open'));
  const dot = SIZES[size] + 2;
  Object.assign($('size-dot').style, { width: dot + 'px', height: dot + 'px', background: COLORS[mode] });
  live.style.cursor = tool === 'eraser' ? 'not-allowed' : tool === 'text' ? 'text' : 'crosshair';
  $('undo').disabled = !undoStack.length;
  $('redo').disabled = !redoStack.length;
}

for (const b of toolbar.querySelectorAll('button')) {
  b.tabIndex = -1;
  b.addEventListener('mousedown', (e) => e.preventDefault()); // never take keyboard focus
}
for (const b of toolbar.querySelectorAll('[data-mode]')) b.onclick = () => setMode(b.dataset.mode);
for (const b of toolbar.querySelectorAll('[data-tool]')) b.onclick = () => setTool(b.dataset.tool);
$('more').onclick = () => { setExtrasOpen(!toolbar.classList.contains('open')); updateButtons(); };
$('size').onclick = () => setSize((size + 1) % SIZES.length);
$('undo').onclick = undo;
$('redo').onclick = redo;
$('cancel').onclick = cancel;
$('ok').onclick = confirm;

// Drag the toolbar by its grip.
$('grip').addEventListener('pointerdown', (e) => {
  const grip = e.currentTarget;
  grip.setPointerCapture(e.pointerId);
  const r = toolbar.getBoundingClientRect();
  const dx = e.clientX - r.left, dy = e.clientY - r.top;
  toolbarPos.style.transform = 'none';
  const move = (ev) => {
    toolbarPos.style.left = clamp(ev.clientX - dx, 0, innerWidth - r.width) + 'px';
    toolbarPos.style.top = clamp(ev.clientY - dy, 0, innerHeight - r.height) + 'px';
  };
  move(e);
  const up = () => { grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); };
  grip.addEventListener('pointermove', move);
  grip.addEventListener('pointerup', up);
});

// Ctrl (or Cmd) + scroll changes the stroke size; preventDefault also stops page zoom.
let wheel = 0;
addEventListener('wheel', (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  e.preventDefault();
  if (simple) return;
  wheel += e.deltaY || e.deltaX;
  if (Math.abs(wheel) >= 50) { setSize(size + (wheel < 0 ? 1 : -1)); wheel = 0; }
}, { passive: false });

addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  const key = e.key.toLowerCase();
  if (simple && 'tne+-='.includes(key)) return;
  if (mod && key === 'z') { e.shiftKey ? redo() : undo(); }
  else if (mod && key === 'y') redo();
  else if (mod) return;
  else if (e.key === 'Enter') confirm();
  else if (e.key === 'Escape') cancel();
  else if (key === '1') setMode('add');
  else if (key === '2') setMode('remove');
  else if (key === '3') setMode('change');
  else if (key === 'p') setTool('pen');
  else if (key === 'b') setTool('box');
  else if (key === 'a') setTool('arrow');
  else if (key === 't') setTool('text');
  else if (key === 'n') setTool('marker');
  else if (key === 'e') setTool('eraser');
  else if (key === '+' || key === '=') setSize(size + 1);
  else if (key === '-') setSize(size - 1);
  else return;
  e.preventDefault();
});

addEventListener('contextmenu', (e) => e.preventDefault());
reset();
invoke('overlay_loaded');
</script>
</body>
