name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A screenshot or a screen recording helps a lot. If it shows anything private, hide it first: press `R` in Scribble2Fix and drag over it.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press F6
        2. ...
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Freezing the screen / hotkey
        - Drawing and the toolbar
        - Copying, saving or sending a scribble
        - Connecting an AI tool / /scribble command
        - An AI asking for a scribble (request card)
        - Installing or updating
        - Settings or the welcome screen
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Scribble2Fix version
      description: Tray icon → Settings → About (the version is shown at the top)
      placeholder: "1.1.4"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux (X11)
        - Linux (Wayland)
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version / distribution
      placeholder: "Windows 11 24H2, macOS 15.2, Ubuntu 24.04 (GNOME), ..."
  - type: input
    id: monitors
    attributes:
      label: Monitors
      description: How many, and their scaling. Many display issues depend on it.
      placeholder: "2 monitors: 2560×1440 at 100%, 3840×2160 at 150%"
  - type: dropdown
    id: tool
    attributes:
      label: AI tool involved (if any)
      options:
        - None / clipboard only
        - Claude Code
        - Claude Desktop
        - Codex
        - GitHub Copilot
        - Cursor
        - Gemini CLI / Antigravity
        - OpenCode
        - Lumo
        - Other MCP client
