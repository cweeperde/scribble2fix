[package]
name = "scribble2fix"
version = "1.0.0"
edition = "2021"
description = "Mark up your screen and hand it to an AI coding tool"
license-file = "../LICENSE"
authors = ["cweeper"]
repository = "https://github.com/cweeperde/scribble2fix"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
xcap = "0.9"
arboard = "3"
active-win-pos-rs = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
