<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scribble2Fix</title>
<style>
  /* An AI tool asks the user for a scribble. Always dark: it floats over anything. */
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  :root { --add: #34c759; --remove: #ff3b30; --change: #0a84ff; --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --spring: cubic-bezier(0.2, 1.3, 0.35, 1); }
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden; color: #f2f2f5;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  body { display: flex; justify-content: center; align-items: flex-start; padding-top: 18px; box-sizing: border-box; }

  #card {
    position: relative; width: 460px; box-sizing: border-box; padding: 16px 18px 14px;
    border-radius: 18px; background: rgba(26, 26, 31, 0.95);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.3);
    opacity: 0; transform: translateY(-28px) scale(0.96);
  }
  /* A thin border in the three mark colors that slowly turns. */
  #card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--a), var(--add), var(--change), var(--remove), var(--add));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    opacity: 0.85; animation: turn 5s linear infinite;
  }
  @keyframes turn { to { --a: 360deg; } }
  body.on #card { animation: drop 0.6s var(--spring) forwards; }
  body.off #card { animation: lift 0.18s var(--ease) forwards; }
  @keyframes drop { from { opacity: 0; transform: translateY(-28px) scale(0.96); } to { opacity: 1; transform: none; } }
  @keyframes lift { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-14px) scale(0.98); } }

  .top { display: flex; gap: 14px; align-items: flex-start; }
  /* Spinning color ring with a pen inside, pulsing outwards. */
  #icon { position: relative; flex: none; width: 42px; height: 42px; margin-top: 1px; }
  #icon .ring {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from var(--a), var(--add), var(--change), var(--remove), var(--add));
    -webkit-mask: radial-gradient(circle, transparent 16px, #000 16.5px); mask: radial-gradient(circle, transparent 16px, #000 16.5px);
    animation: turn 2.4s linear infinite;
  }
  #icon .pulse { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--change); opacity: 0; animation: pulse 2s var(--ease) infinite 0.6s; }
  @keyframes pulse { from { transform: scale(1); opacity: 0.6; } to { transform: scale(1.7); opacity: 0; } }
  #icon svg { position: absolute; inset: 11px; width: 20px; height: 20px; }
  body.on #icon svg { animation: wiggle 0.9s var(--ease) 0.35s; }
  @keyframes wiggle { 0%, 100% { transform: none; } 25% { transform: rotate(-14deg); } 55% { transform: rotate(9deg); } 80% { transform: rotate(-4deg); } }

  .text { flex: 1; min-width: 0; }
  #title { font-weight: 650; font-size: 15px; color: #c7c7cf; }
  #reason {
    margin-top: 3px; color: #fff; font-size: 17px; font-weight: 600; line-height: 1.35; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .text > * { opacity: 0; }
  body.on .text > * { animation: rise 0.45s var(--ease) forwards; }
  body.on #reason { animation-delay: 0.08s; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

  .actions { display: flex; gap: 8px; margin-top: 14px; }
  button {
    all: unset; box-sizing: border-box; height: 36px; padding: 0 16px; border-radius: 10px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; font-weight: 600;
    transition: filter 0.15s, transform 0.12s var(--ease), background-color 0.15s;
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: scale(0.96); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #draw { flex: 1; justify-content: center; background: var(--change); color: #fff; box-shadow: 0 0 0 0 rgba(10, 132, 255, 0.5); }
  body.on #draw { animation: invite 2.2s ease-in-out 0.8s infinite; }
  @keyframes invite { 0%, 100% { box-shadow: 0 0 0 0 rgba(10, 132, 255, 0.45); } 50% { box-shadow: 0 0 0 6px rgba(10, 132, 255, 0); } }
  #draw kbd {
    font: 600 11px ui-monospace, SFMono-Regular, Consolas, monospace; padding: 2px 6px; border-radius: 5px;
    background: rgba(255, 255, 255, 0.2);
  }
  #decline { background: rgba(255, 255, 255, 0.08); color: #e5e5ea; }

  .time { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 11px; color: #8e8e96; }
  .bar { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
  #fill { height: 100%; width: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--add), var(--change)); transform-origin: left; transition: transform 1s linear; }
  #left { font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>
<div id="card" role="alertdialog" aria-labelledby="title" aria-describedby="reason">
  <div class="top">
    <div id="icon" aria-hidden="true">
      <div class="pulse"></div><div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20z"/><path d="M13.5 7.5l3 3"/></svg>
    </div>
    <div class="text">
      <div id="title"></div>
      <div id="reason"></div>
    </div>
  </div>
  <div class="actions">
    <button id="draw">Draw now <kbd id="key"></kbd></button>
    <button id="decline">Not now</button>
  </div>
  <div class="time"><div class="bar"><div id="fill"></div></div><span id="left"></span></div>
</div>
<script src="guard.js"></script>
<script src="common.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let expiresAt = 0, total = 1, timer, lastId = '';

// A soft two-note chime, made on the fly (no sound file needed).
function chime() {
  try {
    const ctx = new AudioContext();
    const now = ctx.currentTime;
    [[659.25, 0], [987.77, 0.12]].forEach(([freq, at]) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + at);
      gain.gain.linearRampToValueAtTime(0.16, now + at + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + at + 0.7);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + at); osc.stop(now + at + 0.75);
    });
    setTimeout(() => ctx.close(), 1200);
  } catch {}
}

function tick() {
  const ms = Math.max(0, expiresAt - Date.now());
  const s = Math.ceil(ms / 1000);
  $('left').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} left`;
  $('fill').style.transform = `scaleX(${ms / total})`;
}

window.__TAURI__.event.listen('request', ({ payload }) => {
  $('title').textContent = `${payload.client} asks you to show it:`;
  $('reason').textContent = payload.reason;
  $('key').textContent = prettyHotkey(payload.hotkey);
  expiresAt = payload.expiresAt;
  total = Math.max(1, expiresAt - Date.now());
  tick();
  clearInterval(timer);
  timer = setInterval(tick, 1000);
  // Replay the entrance (and the chime) only for a new request.
  if (payload.id !== lastId) {
    lastId = payload.id;
    document.body.classList.remove('on', 'off');
    void document.body.offsetWidth;
    if (payload.sound) chime();
  }
  document.body.classList.remove('off');
  document.body.classList.add('on');
});

let answered = false;
async function answer(command) {
  if (answered) return;
  answered = true;
  document.body.classList.replace('on', 'off');
  await new Promise((r) => setTimeout(r, 160));
  await invoke(command).catch(() => {});
  answered = false;
}
$('draw').onclick = () => answer('request_draw');
$('decline').onclick = () => answer('request_decline');
</script>
</body>
</html>
